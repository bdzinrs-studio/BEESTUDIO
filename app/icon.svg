<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="beeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D" />
      <stop offset="100%" stop-color="#FF6A00" />
    </linearGradient>
  </defs>
  <!-- Hexagon Outer Shape -->
  <polygon 
    points="16,2 29,9.5 29,22.5 16,30 3,22.5 3,9.5" 
    fill="url(#beeOrange)" 
  />
  <!-- Inner Circuit / Node Accent -->
  <polygon 
    points="16,6 25,11.2 25,20.8 16,26 7,20.8 7,11.2" 
    fill="#0A0A0A" 
  />
  <!-- Center Core Node -->
  <circle cx="16" cy="16" r="3.5" fill="#FF6A00" />
  <circle cx="16" cy="10" r="1.5" fill="#FF8A3D" />
  <circle cx="21" cy="19" r="1.5" fill="#FF8A3D" />
  <circle cx="11" cy="19" r="1.5" fill="#FF8A3D" />
  <!-- Connecting Lines -->
  <line x1="16" y1="16" x2="16" y2="10" stroke="#FF6A00" stroke-width="1.2" />
  <line x1="16" y1="16" x2="21" y2="19" stroke="#FF6A00" stroke-width="1.2" />
  <line x1="16" y1="16" x2="11" y2="19" stroke="#FF6A00" stroke-width="1.2" />
</svg>
